    <!-- Set the theme before first paint to avoid a flash of the wrong palette.
         An explicit stored choice wins; otherwise follow the OS preference on
         first visit. Mirrors initialTheme() in ThemeContext. Does NOT persist —
         only an explicit toggle should. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jh-theme');
          var t =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', t);

          // Palette (colour flavour) is independent of light/dark. Stored choice
          // wins; no OS signal, so first visit is the heather default. Mirrors
          // initialPalette() in ThemeContext. Set before paint to avoid a flash
          // of the wrong accent.
          var p = localStorage.getItem('palette');
          document.documentElement.setAttribute(
            'data-palette',
            p === 'yorkshire' ? 'yorkshire' : 'default',
          );
        } catch (e) {
          // Storage can be unavailable (private mode / blocked cookies). Fall
          // back to the same OS-derived theme the app itself resolves to.
          var osDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute(
            'data-theme',
            osDark ? 'dark' : 'light',
          );
          document.documentElement.setAttribute('data-palette', 'default');
        }
      })();
    </script>

    <!-- Preload the portrait on the desk (the LCP element) so the browser

    <!-- Weights are the ones the design actually sets: Inter Tight 800 for the
         headline and display copy, JetBrains Mono 500–700 for labels and data.
         Asking for a weight the family doesn't ship makes the browser fake it by
         smearing the nearest face, so the faces are loaded rather than
         synthesised. -->

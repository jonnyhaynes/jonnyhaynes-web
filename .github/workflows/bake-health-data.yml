name: Bake health data

# Fetches steps + active minutes + sleep + resting heart rate from the Google
# Health API and commits the refreshed public/data/health.json to main. Runs
# twice daily plus on demand.
#
# No token rotation: Google does not rotate the refresh token on a normal
# refresh, so — unlike the old Fitbit bake — there is no persist-token step and
# no secrets-write PAT. The built-in GITHUB_TOKEN with contents:write is enough.
on:
  schedule:
    # 08:00 and 20:00 UTC (offset from the GitHub/Spotify bakes to spread load).
    - cron: '0 8,20 * * *'
  workflow_dispatch: {}

concurrency:
  group: bake-health-data
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Google Health data
        env:
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
        run: node scripts/fetch-health.mjs

      # main is a protected branch (PR required + Vercel check), so we can't push
      # to it directly. Push the refreshed data to a fixed branch, open a PR if
      # one isn't already open, and enable auto-merge — since the branch rule
      # requires 0 approvals, it merges itself once the Vercel check passes.
      - name: Open/refresh data PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="public/data/health.json"
          if git diff --quiet -- $files; then
            echo "No change in health data — nothing to commit."
            exit 0
          fi

          branch="bake/health-data"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add $files
          git commit -m "Refresh health data [skip ci]"
          # Force: this is a disposable, machine-owned data branch.
          git push --force origin "$branch"

          # Open the PR only if there isn't already an open one for this branch.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$branch" \
              --title "Refresh health data" \
              --body "Automated data bake (steps, active minutes, sleep, resting HR from Google Health). Auto-merges once the Vercel check passes."
            gh pr merge "$branch" --auto --squash
          fi

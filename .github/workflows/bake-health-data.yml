name: Bake health data

# Fetches steps + active minutes + resting heart rate + calories (and 3-day
# histories) from Garmin Connect, plus weather + sun times from Open-Meteo, and
# commits the refreshed public/data/health.json to main. Runs every 6 hours plus
# on demand.
#
# TOKEN ROTATION: unlike the Google Health bake, Garmin's short-lived oauth2
# token is refreshed from the long-lived oauth1 token during the run, so the
# fetch script prints the refreshed bundle and we persist it back to the
# GARMIN_TOKEN_BUNDLE secret. Updating a secret needs a PAT with secrets:write
# (GARMIN_TOKEN_PAT) — the built-in GITHUB_TOKEN cannot. See
# docs/plans/migrate-google-health-to-garmin.md.
on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC. (UTC-only cron, so in UK
    # summer/BST these land an hour later locally — fine for slow-moving data.)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: {}

concurrency:
  group: bake-health-data
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the dispatched ref (defaults to main on schedule) so a manual
          # workflow_dispatch from a branch runs THAT branch's fetch script —
          # essential for debugging without merging to main first.
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch Garmin health data
        id: fetch
        env:
          GARMIN_TOKEN_BUNDLE: ${{ secrets.GARMIN_TOKEN_BUNDLE }}
        run: |
          set -euo pipefail
          # Tee stdout so we can both show logs and capture the refreshed bundle.
          node scripts/fetch-health.mjs | tee fetch.log
          # Extract the refreshed bundle line (GARMIN_TOKEN_BUNDLE={...}) if present.
          bundle="$(grep -m1 '^GARMIN_TOKEN_BUNDLE=' fetch.log | sed 's/^GARMIN_TOKEN_BUNDLE=//' || true)"
          if [ -n "$bundle" ]; then
            # Stash to a file (avoids putting the token in step outputs/logs).
            printf '%s' "$bundle" > refreshed-bundle.json
            echo "has_bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bundle=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f fetch.log

      - name: Persist refreshed token bundle
        # Garmin rotates the oauth2 token during the run; write it back so the
        # next bake starts fresh. Skipped if the script emitted no bundle.
        if: steps.fetch.outputs.has_bundle == 'true'
        env:
          GH_TOKEN: ${{ secrets.GARMIN_TOKEN_PAT }}
        run: |
          set -euo pipefail
          gh secret set GARMIN_TOKEN_BUNDLE --body "$(cat refreshed-bundle.json)"
          rm -f refreshed-bundle.json

      # main is a protected branch (PR required + Vercel check), so we can't push
      # to it directly. Push the refreshed data to a fixed branch, open a PR if
      # one isn't already open, and enable auto-merge — since the branch rule
      # requires 0 approvals, it merges itself once the Vercel check passes.
      - name: Open/refresh data PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="public/data/health.json"
          if git diff --quiet -- $files; then
            echo "No change in health data — nothing to commit."
            exit 0
          fi

          branch="bake/health-data"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add $files
          git commit -m "Refresh health data [skip ci]"
          # Force: this is a disposable, machine-owned data branch.
          git push --force origin "$branch"

          # Open the PR only if there isn't already an open one for this branch.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main --head "$branch" \
              --title "Refresh health data" \
              --body "Automated data bake (steps, active minutes, sleep, resting HR from Garmin Connect). Auto-merges once the Vercel check passes."
            gh pr merge "$branch" --auto --squash
          fi
